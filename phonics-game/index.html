<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YURI Phonics Land</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7fb;color:#2b2528}.wrap{max-width:900px;margin:auto;padding:16px}.screen{display:none}.screen.active{display:block}.card{background:#fff;border:2px solid #ffd4e5;border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:0 10px 24px #0001}h1{font-size:30px;margin:0 0 8px}h2{margin:0 0 12px}.center{text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}button,select{font-size:18px;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;box-shadow:0 3px 0 #0001}button{background:#ece4ff}.primary{background:#ff7aa8;color:white;font-weight:800}.soft{background:#fff1bd}.back{background:#eee}.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.mode{border-radius:28px;padding:22px;min-height:190px;cursor:pointer}.review{background:#e0f2ff}.quiz{background:#ffd8e8}.icon{font-size:60px}.mascot{font-size:50px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:12px;margin-top:14px}.grid button{min-height:72px;font-size:30px;font-weight:900;background:#f4efff;border:2px solid #ddd1ff}.grid button.correct{background:#dcf7df}.grid button.wrong{background:#ffe1e1}.big{font-size:58px;font-weight:900;text-align:center;padding:12px}.bubble{display:inline-block;background:#fff;border:2px solid #ffd1e2;border-radius:20px;padding:10px 14px;font-weight:800}.status{font-size:22px;font-weight:800;min-height:34px;text-align:center}.score{font-weight:800}.small{font-size:14px;color:#746a70}textarea{width:100%;min-height:150px;border-radius:12px;padding:10px}#loading{position:fixed;inset:0;z-index:99;background:#555b;display:grid;place-items:center}.loadbox{background:#fff;border-radius:26px;padding:28px;text-align:center;width:min(430px,92vw)}.spin{width:58px;height:58px;border:7px solid #ffe1ee;border-top-color:#ff7aa8;border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}.spin.stopped{animation:none;border-top-color:#ffe1ee}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}h1{font-size:25px}}
</style>
</head>
<body>
<div id="loading"><div class="loadbox"><div id="spin" class="spin stopped"></div><h2>準備音軌</h2><p id="loadText">iPhone / iPad 需要先撳一次開始，先可以播放 MP3。</p><button id="unlockBtn" class="primary">開始學習</button><p class="small">如果第一次無聲，請再撳一次「開始學習」。</p></div></div>
<main class="wrap">
<section id="home" class="screen active"><div class="card center"><h1>YURI Phonics Land</h1><p>聽一聽，認一認，揀返正確兩字母合音。</p><div class="mascot">🐰 🐱 🐻</div><p class="small">音軌已放在 <code>assets/phonics_audio.mp3</code>，不用再 upload。</p><div class="homegrid"><div id="toReview" class="mode review"><div class="icon">📖</div><h2>重溫一下</h2><p>揀一行，再逐個音節聽。</p></div><div id="toQuiz" class="mode quiz"><div class="icon">🎧</div><h2>考一考我</h2><p>全部音節 random 出題。</p></div></div></div><div class="card"><details><summary>家長設定：時間表</summary><textarea id="configBox"></textarea><div class="row"><button id="applyConfig">套用設定</button><button id="resetConfig">還原預設</button></div><p class="small" id="audioNotice">等待開始學習。</p></details></div></section>
<section id="reviewScreen" class="screen"><div class="card"><div class="row space"><button id="reviewBack" class="back">← 返回主頁</button><h2>📖 重溫一下</h2></div><p class="small">揀一行，再撳音節試聽。重溫模式不計分。</p><div class="row"><select id="reviewRow"></select><button id="playFirst" class="soft">播放第一個音</button></div><div id="reviewGrid" class="grid"></div><p id="reviewStatus" class="status"></p></div></section>
<section id="quizScreen" class="screen"><div class="card"><div class="row space"><button id="quizBack" class="back">← 返回主頁</button><h2>🎧 考一考我</h2></div><p class="center"><span id="msg" class="bubble">聽清楚，今題係邊個音？</span></p><div id="question" class="big">🎧</div><div class="row center"><button id="replay">再聽一次</button><button id="slow">慢速聽</button><button id="showAns">顯示答案</button><button id="next" class="soft">下一題</button></div><div id="choices" class="grid"></div><p id="status" class="status"></p><p id="score" class="score center">分數：0 / 0 ⭐ 連續答啱：0</p></div></section>
</main>
<audio id="audio" preload="metadata" src="assets/phonics_audio.mp3"></audio>
<script src="clips-config.js"></script>
<script>
const audio=document.getElementById('audio'),loading=document.getElementById('loading'),loadText=document.getElementById('loadText'),unlockBtn=document.getElementById('unlockBtn'),spin=document.getElementById('spin');
const screens=[home,reviewScreen,quizScreen],reviewRow=document.getElementById('reviewRow'),reviewGrid=document.getElementById('reviewGrid'),reviewStatus=document.getElementById('reviewStatus'),choices=document.getElementById('choices'),question=document.getElementById('question'),statusEl=document.getElementById('status'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg'),configBox=document.getElementById('configBox'),audioNotice=document.getElementById('audioNotice');
let config=JSON.parse(JSON.stringify(window.PHONICS_CLIPS||{})),answer=null,answerRow=null,score=0,total=0,streak=0,timer=null,unlocked=false;
const praise=['好叻呀！⭐','答啱！你聽得好清楚 🐱','Excellent！小熊拍手 🐻','Good job！再嚟一題！'];
function show(s){screens.forEach(x=>x.classList.remove('active'));s.classList.add('active');scrollTo(0,0)}
function rows(){return Object.keys(config)}function items(r){return Object.keys(config[r]||{})}function all(){let a=[];rows().forEach(r=>items(r).forEach(i=>a.push({row:r,item:i})));return a}
function finishUnlock(){unlocked=true;audio.muted=false;audio.volume=1;loading.classList.add('hidden');audioNotice.textContent='音軌已解鎖，可以播放。'}
async function unlockAudio(){unlockBtn.disabled=true;spin.classList.remove('stopped');loadText.textContent='正在解鎖音軌...';audio.muted=true;audio.volume=0;try{audio.load();await audio.play();audio.pause();audio.currentTime=0;finishUnlock()}catch(e){audio.muted=false;audio.volume=1;unlockBtn.disabled=false;spin.classList.add('stopped');loadText.textContent='Safari 未開始播放，請再撳一次「開始學習」。';audioNotice.textContent='音軌未解鎖，請在灰色畫面撳開始學習。'}}
unlockBtn.addEventListener('click',unlockAudio,{passive:true});unlockBtn.addEventListener('touchend',unlockAudio,{passive:true});
audio.addEventListener('error',()=>{loadText.textContent='未能載入 assets/phonics_audio.mp3，請檢查 assets folder。';unlockBtn.disabled=false;spin.classList.add('stopped');audioNotice.textContent=loadText.textContent});
function render(){configBox.value=JSON.stringify(config,null,2);reviewRow.innerHTML='';rows().forEach(r=>{let o=document.createElement('option');o.value=r;o.textContent=r+'：'+items(r).join(' ');reviewRow.appendChild(o)});renderReview()}
function renderReview(){let r=reviewRow.value||rows()[0];reviewGrid.innerHTML='';items(r).forEach(i=>{let b=document.createElement('button');b.textContent=i;b.onclick=()=>{reviewStatus.textContent='試聽：'+i;play(i,r)};reviewGrid.appendChild(b)})}
function play(name,row,rate=1){let c=config[row]?.[name];if(!c)return;let[start,end]=c;clearTimeout(timer);audio.pause();audio.muted=false;audio.volume=1;audio.playbackRate=rate;audio.currentTime=start;let p=audio.play();if(p)p.catch(()=>audioNotice.textContent='Safari 阻止播放，請返回主頁後重新開始學習。');timer=setTimeout(()=>{audio.pause();audio.playbackRate=1},Math.max(100,(end-start)*1000/rate))}
function makeChoices(correct){let pool=[...new Set(all().map(x=>x.item))].filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,4);return[...pool,correct].sort(()=>Math.random()-.5)}
function nextQ(){let a=all()[Math.floor(Math.random()*all().length)];answer=a.item;answerRow=a.row;question.textContent='🎧';statusEl.textContent='';msg.textContent='聽清楚，今題係邊個音？';choices.innerHTML='';makeChoices(answer).forEach(i=>{let b=document.createElement('button');b.textContent=i;b.onclick=()=>check(i,b);choices.appendChild(b)});play(answer,answerRow)}
function scoreText(){scoreEl.textContent=`分數：${score} / ${total} ⭐ 連續答啱：${streak}`}
function check(i,b){total++;if(i===answer){score++;streak++;b.classList.add('correct');question.textContent=answer;statusEl.textContent='答啱！'+answer;msg.textContent=praise[Math.floor(Math.random()*praise.length)];setTimeout(nextQ,950)}else{streak=0;b.classList.add('wrong');statusEl.textContent='差少少，再聽一次。';msg.textContent='唔緊要，小耳朵再聽多次。';play(answer,answerRow)}scoreText()}
function startQuiz(){score=total=streak=0;scoreText();show(quizScreen);nextQ()}
toReview.onclick=()=>show(reviewScreen);toQuiz.onclick=startQuiz;reviewBack.onclick=()=>show(home);quizBack.onclick=()=>show(home);reviewRow.onchange=renderReview;playFirst.onclick=()=>{let r=reviewRow.value,i=items(r)[0];if(i)play(i,r)};replay.onclick=()=>answer&&play(answer,answerRow);slow.onclick=()=>answer&&play(answer,answerRow,.75);showAns.onclick=()=>{if(answer){question.textContent=answer;statusEl.textContent='答案：'+answer}};next.onclick=nextQ;applyConfig.onclick=()=>{try{config=JSON.parse(configBox.value);render();audioNotice.textContent='已套用設定。'}catch(e){audioNotice.textContent='設定格式有問題。'}};resetConfig.onclick=()=>{config=JSON.parse(JSON.stringify(window.PHONICS_CLIPS||{}));render()};
render();
</script>
</body>
</html>
