name: Homework Playwright QA

on:
  push:
    paths:
      - 'phonics-game/**'
      - 'tests/homework-pages-smoke.spec.js'
      - 'tests/homework-full-qa.spec.js'
      - '.github/workflows/homework-playwright-qa.yml'
  workflow_dispatch:
    inputs:
      homework_url:
        description: Homework page URL
        required: true
        default: https://hkspurs.github.io/yurilearning/phonics-game/homework.html?v=gggeeeggu
      qa_mode:
        description: QA mode: smoke or full
        required: true
        default: full

jobs:
  homework-playwright-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Run homework QA
        env:
          HOMEWORK_URL: ${{ github.event.inputs.homework_url || 'https://hkspurs.github.io/yurilearning/phonics-game/homework.html?v=gggeeeggu' }}
          QA_MODE: ${{ github.event.inputs.qa_mode || 'full' }}
        run: |
          if [ "$QA_MODE" = "smoke" ]; then
            npx playwright test tests/homework-pages-smoke.spec.js --project=chromium --reporter=list
          else
            npx playwright test tests/homework-pages-smoke.spec.js tests/homework-full-qa.spec.js --project=chromium --reporter=list
          fi
